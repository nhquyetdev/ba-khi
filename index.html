<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GodK Bá Khí v1.11</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#06050a;color:#eee;font-family:'Be Vietnam Pro','Segoe UI',Roboto,Arial,sans-serif;touch-action:none;user-select:none}
  canvas#cv{position:fixed;inset:0;display:block}
  .btn{background:linear-gradient(#2a2535,#1a1622);color:#eee;border:1px solid #4a4060;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center;font-weight:600}
  .btn:hover{border-color:#a08cff;filter:brightness(1.2)}
  .btn.gold{background:linear-gradient(#a8801c,#6a4c08);border-color:#ffd35a;color:#fff6d8}
  .btn.red{background:linear-gradient(#8a1a24,#4a0a10);border-color:#ff5060}
  .muted{color:#9a93ad}.small{font-size:12px}
  button,input,textarea,select{font-family:inherit}
  input,textarea{background:#110e18;color:#fff;border:1px solid #4a4060;border-radius:8px;padding:10px;font-size:15px;outline:none;user-select:text}
  input:focus{border-color:#a08cff}
  .shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .rainbow{padding-top:.12em;background:linear-gradient(90deg,#f55,#fa3,#ff5,#5f7,#5cf,#a6f,#f5c,#f55);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:rb 3s linear infinite}
  @keyframes rb{to{background-position:300% 0}}

  /* Lobby */
  #lobby{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5vh 16px 0;z-index:5;overflow:auto}
  .logo{font-size:clamp(38px,8vw,78px);font-weight:900;letter-spacing:2px;background:linear-gradient(180deg,#fff7c8,#ffb52a 45%,#ff3d1f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,140,0,.55));text-align:center;line-height:1.3;padding:.12em .1em 0}
  .logo small{display:block;font-size:.32em;letter-spacing:6px;color:#ffd98a;-webkit-text-fill-color:#ffd98a;margin-top:6px}
  .tag{color:#cfc4e8;margin:10px 0 18px;text-align:center;font-style:italic}
  .card{background:rgba(14,11,22,.82);border:1px solid #3a3050;border-radius:14px;padding:16px;width:min(420px,94vw);backdrop-filter:blur(4px);display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
  .row.col{flex-direction:column}
  .row input{flex:1;min-width:0}
  #roomList{display:flex;flex-direction:column;gap:6px;max-height:150px;overflow:auto}
  .roomItem{background:#1a1625;border:1px solid #3a3050;color:#eee;border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;display:flex;justify-content:space-between}
  .roomItem:hover{border-color:#a08cff}
  #langBtn{position:fixed;top:12px;right:12px;z-index:6}

  /* HUD */
  #hud{display:none;position:fixed;inset:0;pointer-events:none;z-index:3;transition:opacity .4s}
  #hud.dim{opacity:0}
  #hud > *{pointer-events:auto}
  #me{position:absolute;top:10px;left:10px;background:rgba(8,6,14,.72);border:1px solid #2e2840;border-radius:12px;padding:10px 12px;min-width:220px;max-width:min(360px,60vw)}
  #hName{font-size:13px;color:#bbb}
  #hTitle{font-size:22px;font-weight:900;text-shadow:0 0 12px currentColor;line-height:1.4;word-break:break-word}
  #hTier{font-size:11px;color:#9a93ad;letter-spacing:1px;text-transform:uppercase}
  #hLv{font-size:12px;margin-top:4px;color:#ddd}
  .xp{height:8px;background:#1a1624;border-radius:4px;margin-top:4px;overflow:hidden}
  #xpFill{height:100%;width:0;background:linear-gradient(90deg,#4cf,#a6f);transition:width .15s}
  #xpFill.capped{background:linear-gradient(90deg,#f33,#f90);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.5}}
  #hRate{font-size:11px;color:#9fe;margin-top:4px}
  #hBuff{font-size:13px;font-weight:800;color:#ffd84a;text-shadow:0 0 8px #f90;margin-top:4px;display:none;animation:pulse 1.2s infinite}
  #hEvent{font-size:11px;color:#ffe39a;margin-top:3px}
  #roomCode{font-size:11px;color:#777;margin-top:4px}
  #lb{position:absolute;top:10px;right:10px;width:min(270px,44vw);background:rgba(8,6,14,.72);border:1px solid #2e2840;border-radius:12px;padding:8px}
  .tabs{display:flex;gap:4px;margin-bottom:6px}
  .tabs button{flex:1;background:#151220;border:1px solid #2e2840;color:#aaa;border-radius:6px;padding:5px;font-size:12px;cursor:pointer}
  .tabs button.on{color:#fff;border-color:#a08cff}
  #lbList{max-height:34vh;overflow:auto;display:flex;flex-direction:column;gap:3px}
  .lbRow{display:flex;flex-direction:column;padding:4px 6px;border-radius:6px;background:rgba(255,255,255,.03);cursor:pointer}
  .lbRow:hover{background:rgba(160,140,255,.12)}
  .lbRow.me{border-left:3px solid #fff}
  .lbName{font-size:12px;color:#ccc}.lbTitle{font-size:13px;font-weight:800}
  .rb{color:#c9f}
  #btns{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
  #btns .btn{padding:8px 10px;font-size:13px;min-width:110px}
  #minimap{position:absolute;left:10px;bottom:10px;width:140px;height:140px;border-radius:10px;opacity:.9}
  #capMsg{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(60,0,0,.75);border:1px solid #f33;color:#fcc;padding:8px 14px;border-radius:10px;font-weight:700;display:none;text-align:center;max-width:80vw;animation:pulse 2s infinite}
  #sanctBtn{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);display:none}
  #gateBtn{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);display:none;font-size:18px;padding:14px 26px}
  #toasts{position:fixed;top:30%;left:50%;transform:translateX(-50%);z-index:8;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(520px,92vw)}
  .toast{background:rgba(10,8,18,.9);border:1px solid #5a4a80;border-radius:10px;padding:10px 14px;text-align:center;transition:opacity .5s, transform .5s;font-size:14px}
  .toast.out{opacity:0;transform:translateY(-20px)}
  #banner{position:fixed;top:20%;left:0;right:0;text-align:center;z-index:7;pointer-events:none;opacity:0}
  #banner.show{animation:ban 3.6s ease-out forwards}
  @keyframes ban{0%{opacity:0;transform:scale(2.2)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
  .bTop{font-size:clamp(13px,2vw,18px);letter-spacing:6px;color:#ddd;text-shadow:0 0 10px #000}
  .bMain{font-size:clamp(30px,7vw,72px);font-weight:900;line-height:1.35;text-shadow:0 0 30px currentColor,0 0 6px #000;padding:0 10px}
  .bSub{font-size:clamp(14px,2.4vw,22px);font-weight:700;color:#fff;text-shadow:0 0 8px #000,0 0 3px #000;margin-top:4px;padding:0 12px}
  .vol{display:flex;flex-direction:column;gap:8px;margin:10px auto;max-width:320px;text-align:left}
  .vol label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
  .vol input{flex:1;max-width:170px;accent-color:#ffb52a}
  #pvpCard{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(30,6,12,.95);border:2px solid #ff4d5e;border-radius:14px;padding:12px 18px;text-align:center;width:min(360px,92vw);box-shadow:0 0 30px rgba(255,40,60,.5);animation:pvpPop .35s ease-out}
  #pvpCard .pTitle{font-weight:900;color:#ff6b78;letter-spacing:3px}
  #pvpCard .big{font-weight:800;margin:4px 0}
  @keyframes pvpPop{from{transform:translateX(-50%) scale(.6);opacity:0}}
  .wtabs{margin:8px 0}
  .wGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;max-height:38vh;overflow:auto;text-align:left}
  .wItem{background:#16121f;border:1px solid #3a3050;border-radius:8px;padding:7px 8px;color:#eee;cursor:pointer;display:flex;flex-direction:column;gap:2px;font-family:inherit}
  .wItem b{font-size:13px}.wItem small{font-size:11px;color:#aaa}
  .wItem.on{border-color:#ffd35a;box-shadow:0 0 8px rgba(255,210,80,.4)}
  .wItem.lockedW{opacity:.55;cursor:default}
  .wItem.spoil b{filter:blur(.6px);letter-spacing:3px;color:#9a8fb8}
  #ending{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 45%,#1a1424 0%,#000 70%);flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
  #ending p{font-size:clamp(16px,2.6vw,26px);color:#e8e0f0;opacity:0;animation:endIn 1.6s ease-out forwards;text-shadow:0 0 12px rgba(200,180,255,.6);font-style:italic}
  #ending p.last{font-size:clamp(34px,7vw,72px);font-weight:900;font-style:normal;background:linear-gradient(90deg,#f55,#fa3,#ff5,#5f7,#5cf,#a6f,#f5c);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.3}
  #ending .btn{position:absolute;bottom:20px;right:20px}
  @keyframes endIn{from{opacity:0;transform:translateY(12px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
  .bGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;max-height:56vh;overflow:auto;margin-top:8px}
  .bItem{background:#130f1b;border:1px solid #3a3050;border-radius:8px;padding:4px;color:#eee;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
  .bItem canvas{width:96px;height:96px;border-radius:6px}.bItem b{font-size:11px;line-height:1.25}.bItem small{font-size:10px;color:#aaa}
  .bItem.unk{opacity:.6;cursor:default}.bItem:not(.unk):hover{border-color:#a08cff}
  #fightUI{display:none;position:fixed;inset:0;z-index:4;pointer-events:none}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9}
  #modalBody{background:#0f0c17;border:1px solid #4a4060;border-radius:14px;padding:18px;width:min(480px,94vw);max-height:88vh;overflow:auto;text-align:center}
  #modalBody h2{font-size:24px;line-height:1.4;margin-bottom:2px;text-shadow:0 0 12px currentColor}
  #modalBody .big{font-size:18px;font-weight:800;margin:8px 0}
  #modalBody p{margin:6px 0}
  table.st{margin:10px auto;border-collapse:collapse;min-width:240px}
  table.st td{padding:5px 10px;border-bottom:1px solid #221d30;text-align:left}
  table.st td:last-child{text-align:right;font-weight:700}
  #prevCv{display:block;margin:6px auto;border-radius:10px}
  .lore{text-align:left;font-style:italic;color:#d6c79a;font-size:13px;margin-top:8px}
  .codex{text-align:left}
  .cTier{margin:10px 0}
  .cGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px;margin-top:4px}
  .cItem{font-size:12px;padding:4px 6px;background:#16121f;border-radius:6px;font-weight:700}
  .cItem.locked{color:#555;font-weight:400}
  .cItem.cur{outline:1px solid #fff}
  #joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.25);display:none;pointer-events:none;z-index:4}
  #joyKnob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.25)}
  @media (max-width:640px){ #hTitle{font-size:17px} #me{min-width:0;max-width:52vw;padding:8px} #lb{width:44vw} #lbList{max-height:24vh} #minimap{width:96px;height:96px} #btns .btn{min-width:84px;font-size:12px;padding:5px} #capMsg{bottom:auto;top:132px;font-size:13px} #gateBtn{bottom:120px} }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="lobby">
  <div class="logo">GodK Bá Khí<small>v1.9 · 霸氣</small></div>
  <div class="tag" data-t="tagline"></div>
  <div class="card">
    <input id="nameIn" maxlength="16" data-ph="yourName">
    <button class="btn gold" id="createBtn" data-t="createRoom"></button>
    <div class="row"><input id="codeIn" maxlength="6" data-ph="roomCode" style="text-transform:uppercase"><button class="btn" id="joinBtn" data-t="joinRoom"></button></div>
    <div style="display:flex;justify-content:space-between;align-items:center"><b data-t="openRooms"></b><button class="btn" id="refreshRooms" style="padding:4px 10px">⟳</button></div>
    <div id="roomList"></div>
    <div class="muted small" id="modeNote"></div>
    <div class="row">
      <a class="btn" href="https://ko-fi.com/lichstream" target="_blank" rel="noopener">☕ Ko-fi</a>
      <a class="btn" href="https://www.youtube.com/@LichStream" target="_blank" rel="noopener">▶ YouTube</a>
    </div>
  </div>
</div>
<button class="btn" id="langBtn">EN</button>

<div id="hud">
  <div id="me">
    <div id="hName"></div>
    <div id="hTitle"></div>
    <div id="hTier"></div>
    <div id="hLv"></div>
    <div class="xp"><div id="xpFill"></div></div>
    <div id="hRate"></div>
    <div id="hBuff"></div>
    <div id="hEvent"></div>
    <div id="roomCode"></div>
  </div>
  <div id="lb">
    <div class="tabs"><button id="tabRoom" class="on" data-t="roomTab"></button><button id="tabWorld" data-t="globalTab"></button></div>
    <div id="lbList"></div>
  </div>
  <canvas id="minimap" width="140" height="140"></canvas>
  <div id="btns">
    <button class="btn" id="btnStats">📊 <span data-t="stats"></span></button>
    <button class="btn" id="btnWardrobe">🎭 <span data-t="wardrobe"></span></button>
    <button class="btn" id="btnBestiary">📖 <span data-t="bestiary"></span></button>
    <button class="btn" id="btnCodex">📜 <span data-t="codex"></span></button>
    <button class="btn gold" id="btnRebirth" style="display:none">✦ <span data-t="rebirth"></span></button>
    <button class="btn" id="btnSettings">⚙ <span data-t="settings"></span></button>
    <button class="btn red" id="btnSupport">💖 <span data-t="support"></span></button>
    <button class="btn" id="leaveBtn" style="display:none"></button>
  </div>
  <div id="capMsg"></div>
  <button class="btn" id="sanctBtn" style="display:none"></button>
  <button class="btn red" id="gateBtn">獄 <span data-t="gateHint"></span></button>
</div>

<div id="fightUI"></div>
<div id="banner"></div>
<div id="toasts"></div>
<div id="joy"><div id="joyKnob"></div></div>
<div id="pvpCard" style="display:none"></div>
<div id="ending" style="display:none"></div>
<div id="modal"><div id="modalBody"></div></div>

<script src="config.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/net.js"></script>
<script src="js/render.js"></script>
<script src="js/render2.js"></script>
<script src="js/render3.js"></script>
<script src="js/render4.js"></script>
<script src="js/render5.js"></script>
<script src="js/render6.js"></script>
<script src="js/render7.js"></script>
<script src="js/render8.js"></script>
<script src="js/game.js"></script>
</body>
</html>
